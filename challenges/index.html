<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101410">
  <title>Challenges | Dashiel Soleon</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      background: #101410;
      color: #d7e2d2;
      --green: #9de67b;
      --muted: #91a18d;
      --line: #2a372b;
    }

    * { box-sizing: border-box; }

    body { min-height: 100vh; margin: 0; padding: 48px 20px; }
    main {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: clamp(24px, 6vw, 52px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #121812;
    }
    p { color: var(--muted); line-height: 1.8; }
    .prompt { font-size: 13px; }
    .prompt span, h1 { color: var(--green); }
    h1 { font-size: clamp(28px, 6vw, 42px); }
    a { color: var(--green); text-underline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="prompt"><span>dashiel@site</span>:~/challenges$ ls</p>
    <h1>Challenges</h1>
    <p>WIP</p>
    <p><a href="../">← Back to Main</a></p>
  </main>
</body>
</html>
