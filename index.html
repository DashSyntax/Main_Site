<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101410">
  <meta name="description" content="The personal website of Dashiel Soleon.">
  <title>Dashiel Soleon</title>
  <link rel="icon" type="image/png" href="/__Dashiel-Soleon.png">
  <style>
    :root {
      color-scheme: dark;
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      background: #101410;
      color: #d7e2d2;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --green: #9de67b;
      --muted: #91a18d;
      --line: #2a372b;
      --panel: #151c16;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      background-image: radial-gradient(ellipse at top, #1a251b 0, #101410 62%);
    }

    main {
      width: min(100%, 900px);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgb(16 20 16 / 94%);
      box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
    }

    .window-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: #1a211b;
      color: var(--muted);
      font-size: 12px;
    }

    .dot { width: 9px; height: 9px; border-radius: 50%; background: #60725e; }
    .window-title { margin-left: 7px; }

    .content { padding: clamp(24px, 6vw, 56px); }

    .prompt {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .prompt span, h1, h2, .caret { color: var(--green); }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 56px);
      letter-spacing: -0.07em;
      line-height: 1.15;
    }

    .welcome {
      max-width: 680px;
      margin: 24px 0 48px;
      color: #b6c3b2;
      font-size: 15px;
      line-height: 1.9;
    }

    section { margin-top: 40px; }

    h2 {
      margin: 0 0 15px;
      font-size: 17px;
      font-weight: 600;
    }

    .section-label {
      padding: 10px 0;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .challenge-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--green);
      text-decoration: none;
      transition: border-color 150ms ease, background 150ms ease;
    }

    .challenge-link:hover, .challenge-link:focus-visible {
      border-color: var(--green);
      background: #1a261b;
    }

    .videos-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .channel-link, footer a {
      color: var(--green);
      text-underline-offset: 3px;
    }

    .channel-link { font-size: 12px; }

    .video-frame {
      position: relative;
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #080a08;
      aspect-ratio: 16 / 9;
    }

    .videos-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .video-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
    }

    .video-card .video-frame { border: 0; border-radius: 0; }

    .video-card iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-title {
      margin: 0;
      padding: 12px;
      color: #b6c3b2;
      font-size: 12px;
      line-height: 1.6;
    }

    .video-status {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    footer {
      margin-top: 48px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 520px) {
      body { padding: 16px 10px; }
      .content { padding: 26px 20px; }
      .videos-heading { align-items: flex-start; flex-direction: column; gap: 0; }
      .welcome { margin-bottom: 38px; }
    }

    @media (max-width: 700px) {
      .videos-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <div class="window-bar" aria-hidden="true">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="window-title">dashiel@site: ~</span>
    </div>
    <div class="content">
      <header>
        <p class="prompt"><span>dashiel@site</span>:~$ whoami</p>
        <h1>Dashiel Soleon<span class="caret">_</span></h1>
        <p class="welcome">
            WIP
          WIP
        </p>
      </header>

      <section aria-labelledby="challenges-title">
        <p class="section-label">dashiel@site:~$ ls ./</p>
        <h2 id="challenges-title">Challenges</h2>
        <a class="challenge-link" href="challenges/">
          <span aria-hidden="true">[dir]</span>
          <span>challenges/</span>
          <span aria-hidden="true">→</span>
        </a>
      </section>

      <section aria-labelledby="videos-title">
        <p class="section-label">dashiel@site:~$ open latest_videos</p>
        <div class="videos-heading">
          <h2 id="videos-title">Videos</h2>
          <a class="channel-link" href="https://www.youtube.com/@DashielSoleon" target="_blank" rel="noopener noreferrer">
            Visit YouTube channel ↗
          </a>
        </div>
        <p id="videos-status" class="video-status" role="status" aria-live="polite">Loading latest videos...</p>
        <div id="latest-videos" class="videos-grid" hidden>
          <article class="video-card">
            <div class="video-frame">
              <iframe data-video-number="0" title="Latest video 1" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>
            <p class="video-title"></p>
          </article>
          <article class="video-card">
            <div class="video-frame">
              <iframe data-video-number="1" title="Latest video 2" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>
            <p class="video-title"></p>
          </article>
          <article class="video-card">
            <div class="video-frame">
              <iframe data-video-number="2" title="Latest video 3" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>
            <p class="video-title"></p>
          </article>
        </div>
      </section>

      <footer>process exited with code 0 <span aria-hidden="true">·</span> <a href="https://www.youtube.com/@DashielSoleon" target="_blank" rel="noopener noreferrer">youtube.com/@DashielSoleon</a></footer>
    </div>
  </main>
  <script>
    const channelId = "UCBFfrZAmwvj0PkvObT07C0Q";
    const channelFeed = encodeURIComponent(`https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`);
    const videosStatus = document.getElementById("videos-status");
    const videosGrid = document.getElementById("latest-videos");

    async function loadLatestVideos() {
      try {
        const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${channelFeed}`);
        if (!response.ok) {
          throw new Error(`Video feed request failed (${response.status}).`);
        }

        const result = await response.json();
        if (result.status !== "ok" || !Array.isArray(result.items) || result.items.length === 0) {
          throw new Error("The video feed returned no videos.");
        }

        const videoFrames = videosGrid.querySelectorAll("iframe[data-video-number]");
        const videos = Array.from(videoFrames, (iframe) => {
          const number = Number(iframe.dataset.videoNumber);
          const item = result.items[number];
          if (!item || typeof item.guid !== "string" || typeof item.title !== "string") {
            throw new Error(`Video ${number + 1} is missing from the feed.`);
          }

          const videoId = item.guid.match(/^yt:video:([\w-]{11})$/)?.[1];
          if (!videoId) {
            throw new Error(`Video ${number + 1} has an invalid YouTube video ID.`);
          }

          return { iframe, videoId, title: item.title };
        });

        videos.forEach(({ iframe, videoId, title }) => {
          iframe.src = `https://www.youtube.com/embed/${videoId}`;
          iframe.title = title;
          iframe.closest(".video-card").querySelector(".video-title").textContent = title;
        });

        videosGrid.hidden = false;
        videosStatus.hidden = true;
      } catch (error) {
        console.error("Could not load the latest YouTube videos:", error);
        videosStatus.textContent = "Could not load the latest videos. Visit the YouTube channel to watch them.";
      }
    }

    loadLatestVideos();
  </script>
</body>
</html>
